version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: aipdf-postgres

    restart: always

    environment:
      POSTGRES_DB: aipdf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:7-alpine

    container_name: aipdf-redis

    restart: always

    ports:
      - "6379:6379"

volumes:

  postgres_data:
  